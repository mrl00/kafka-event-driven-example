name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1

      - name: Build order-producer
        run: go build -v ./cmd/order-producer

      - name: Build order-consumer
        run: go build -v ./cmd/order-consumer

      - name: Run unit tests
        run: go test -v ./internal/... ./cmd/...
